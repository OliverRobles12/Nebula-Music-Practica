<!DOCTYPE html>
<html lang="es">

  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="../static/styles/stykes.css">
      <title>Nébula Music - Registro</title>
  </head>

  <body>
    <main class="auth-container">
      <section class="auth-card">

        <form class="auth-form"
              method="post"
              action="/crear-cuenta"
              enctype="application/x-www-form-urlencoded">

          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" minlength="3">
          </div>

          <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo">
          </div>

          <div class="form-group">
            <label for="contrasenia">Contraseña:</label>
            <input type="password" id="contrasenia" name="contrasenia">
          </div>

          <div class="form-group">
            <label for="txt_pseudonimo">Pseudonimo:</label>
            <input
                    type="text"
                    id="txt_pseudonimo"
                    name="txt_pseudonimo"
                    pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
            >
          </div>

          <div class="form-group">
            <label>Género</label>
            <input type="radio" id="genero_m" name="rad_genero">
            <label for="genero_m">Masculino</label>
            <input type="radio" id="genero_f" name="rad_genero">
            <label for="genero_f">Femenino</label>
            <input type="radio" id="genero_o" name="rad_genero">
            <label for="genero_o">Otro</label>
          </div>

          <div class="form-group">
            <label for="suscripcion">Suscripción</label>
            <select name="sel_suscripcion" id="suscripcion">
              <option value="gratis">Gratis</option>
              <option value="mensual">Mensual</option>
              <option value="anual">Anual</option>
            </select>
          </div>

         <div class="form-group">
           <label for="fecha">Fecha de nacimineto</label>
           <input type="date" id="fecha" name="fechaNacimiento">
         </div>

          <div class="form-group">
            <input type="checkbox" id="terminos" name="chk_termnos" value="aceptado">
            <label for="terminos">Acepto los términos y condiciones</label>
          </div>

          <div class="form-group">
            <label for="comentarios">Comentarios: </label>
            <textarea
                    name="comentarios"
                    id="comentarios"
                    cols="4"
                    rows="15"
                    placeholder="Escribe aquí tus comentarios...">
            </textarea>
          </div>

          <div class="form-group">
            <input type="submit">
            <input type="reset">
          </div>

        </form>

      </section>
    </main>
  </body>
</html>
